# CLIProxyAPI Configuration
# Docs: https://github.com/router-for-me/CLIProxyAPI
#
# OAuth login (run once per provider, opens browser):
#   docker-compose run --rm cliproxy ./CLIProxyAPI auth login gemini
#   docker-compose run --rm cliproxy ./CLIProxyAPI auth login claude
#   docker-compose run --rm cliproxy ./CLIProxyAPI auth login codex
#
# Tokens are saved in ./cliproxy/auths/ (mounted as /root/.cli-proxy-api)

host: ""
port: 8317

# API keys that LiteLLM (and any other client) must send in Authorization header
api-keys:
  - "your-api-key-1"

# OAuth tokens are stored in auth-dir (mounted volume)
auth-dir: "~/.cli-proxy-api"

# Round-robin routing across credentials
routing:
  strategy: "round-robin"

debug: false
request-retry: 3
