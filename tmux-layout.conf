# coding-agents-loop – tmux visual configuration
# Apply with: tmux source-file tmux-layout.conf

# ── Mouse support ──────────────────────────────────────────────────────────
set -g mouse on

# ── Terminal & color ───────────────────────────────────────────────────────
set -g default-terminal "screen-256color"
set -ga terminal-overrides ",xterm-256color:Tc"

# ── Status bar ─────────────────────────────────────────────────────────────
set -g status on
set -g status-interval 5
set -g status-position bottom
set -g status-style "bg=#1e1e2e,fg=#cdd6f4"

# Left: session name
set -g status-left-length 30
set -g status-left "#[bold,fg=#89b4fa] #S #[default]│ "

# Right: date + time
set -g status-right-length 40
set -g status-right "#[fg=#a6e3a1]%Y-%m-%d #[fg=#89dceb]%H:%M "

# Window list (center)
set -g window-status-format " #I:#W "
set -g window-status-current-format "#[bold,fg=#1e1e2e,bg=#89b4fa] #I:#W "
set -g window-status-style "fg=#585b70"

# ── Pane borders ───────────────────────────────────────────────────────────
set -g pane-border-style "fg=#313244"
set -g pane-active-border-style "fg=#89b4fa"

# ── Pane titles ────────────────────────────────────────────────────────────
set -g pane-border-status top
set -g pane-border-format " #{pane_title} "

# ── Key bindings ───────────────────────────────────────────────────────────
# Reload config
bind r source-file tmux-layout.conf \; display "Config reloaded"
# Split shortcuts
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
