      model: gemini/gemini-2.5-pro
      api_base: http://cliproxy:8080/gemini/v1
      api_key: "unused"

  - model_name: coder
    litellm_params:
      model: openai/codex-1
      api_base: http://cliproxy:8080/codex/v1
