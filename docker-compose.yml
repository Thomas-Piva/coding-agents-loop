version: "3.9"

services:
  cliproxy:
    image: eceasy/cli-proxy-api:latest
    container_name: cliproxy
    ports:
      - "${CLIPROXY_PORT:-8317}:8317"
      # OAuth callback ports (browser redirects here after login)
      - "8085:8085"   # Gemini / Google
      - "1455:1455"   # Claude
      - "54545:54545" # Codex OAuth
      - "51121:51121" # Codex device
      - "11451:11451" # extra providers
    volumes:
      - ./cliproxy/config.yaml:/CLIProxyAPI/config.yaml
      - ./cliproxy/auths:/root/.cli-proxy-api
      - ./cliproxy/logs:/CLIProxyAPI/logs
    restart: unless-stopped

  litellm:
    image: ghcr.io/berriai/litellm:main-latest
    container_name: litellm
    ports:
      - "${LITELLM_PORT:-4000}:4000"
    volumes:
      - ./litellm/config.yaml:/app/config.yaml
    environment:
      - LITELLM_MASTER_KEY=${LITELLM_MASTER_KEY}
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    depends_on:
      - cliproxy
    restart: unless-stopped

  agents:
    build: ./agents
    container_name: agents
    volumes:
      - ./workspace:/workspace
      - ./agents/mcp_servers/config.json:/app/mcp_servers/config.json
    environment:
      - LITELLM_BASE_URL=http://litellm:4000
      - LITELLM_API_KEY=${LITELLM_API_KEY}
      - MAX_REVIEW_ITERATIONS=${MAX_REVIEW_ITERATIONS:-5}
      - GITHUB_TOKEN=${GITHUB_TOKEN:-}
    depends_on:
      - litellm
    restart: unless-stopped
